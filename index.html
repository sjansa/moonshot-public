<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1a22">
<title>Moonshot</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #0c1a22; --panel: rgba(12, 26, 34, 0.82); --line: rgba(255, 255, 255, 0.16);
    --text: #f2f6f8; --dim: #a9bac4; --go: #3fb6ff;
    --display: "Barlow Condensed", "Helvetica Neue", Arial, sans-serif;
    --body: "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
    --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font: 15px/1.4 var(--body); overflow: hidden; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; }

  #top { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--st) + 10px) calc(var(--sr) + 12px) 0 calc(var(--sl) + 12px); display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
  .chip .ver { float: right; margin-left: 10px; opacity: 0.55; font-weight: 500; font-size: 11px; letter-spacing: 0; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font: 600 14px/1.2 var(--display); letter-spacing: 0.04em; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #status { flex: 1; min-width: 0; border-radius: 14px; font-family: var(--body); font-weight: 500; font-size: 13px; letter-spacing: 0; }
  #status b { font: 700 14px var(--display); letter-spacing: 0.06em; text-transform: uppercase; margin-right: 8px; }

  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }

  /* time ruler strip (phase 4 fills it), directly above the dock */
  #ruler { position: fixed; left: calc(var(--sl) + 8px); right: calc(var(--sr) + 8px); height: 64px; bottom: calc(var(--sb) + 84px); touch-action: none; }

  #bar { position: fixed; left: 50%; bottom: calc(var(--sb) + 10px); transform: translateX(-50%); display: flex; gap: 2px; padding: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .tog { background: none; border-radius: 17px; min-width: 58px; min-height: 54px; padding: 6px 6px 5px; display: grid; justify-items: center; align-content: center; gap: 3px; font: 600 12px/1 var(--body); color: var(--dim); white-space: nowrap; }
  .tog svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; }
  .tog[aria-pressed="true"] { color: #fff; background: rgba(255, 255, 255, 0.13); }
  .tog[aria-pressed="true"] svg { opacity: 1; }
  .tog[data-k="sun"][aria-pressed="true"] svg { stroke: #ffd76a; }
  .tog[data-k="moon"][aria-pressed="true"] svg { stroke: #dfe8ff; }
  #more { border-left: 1px solid var(--line); border-radius: 0 17px 17px 0; margin-left: 3px; padding-left: 9px; }

  /* bottom sheet (later phases fill it) */
  .sheet { position: fixed; left: 8px; right: 8px; bottom: calc(var(--sb) + 8px); max-height: 46%; display: flex; flex-direction: column; background: rgba(13, 28, 37, 0.86); border: 1px solid var(--line); border-radius: 22px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); overflow: hidden; }
  .sheet > header { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 10px; border-bottom: 1px solid var(--line); flex: none; }
  .tabs { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: rgba(0, 0, 0, 0.28); border-radius: 13px; padding: 3px; }
  .tabs button { background: none; border-radius: 10px; min-height: 44px; font: 600 14px var(--body); color: var(--dim); }
  .tabs button[aria-selected="true"] { background: rgba(255, 255, 255, 0.16); color: #fff; }
  .pane { overflow: auto; -webkit-overflow-scrolling: touch; padding: 4px 14px 12px; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div id="top">
  <div id="status" class="chip"><b id="statName">Moonshot</b><span id="statTime"></span><span class="ver">1115.1805-901b992</span></div>
</div>

<div id="ruler"></div>
<div id="sheet" class="sheet" hidden></div>

<nav id="bar" aria-label="Layers">
  <button class="tog" data-k="sun" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>Sun</button>
  <button class="tog" data-k="moon" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M19 14.5A8 8 0 019.5 5a8 8 0 109.5 9.5z"/></svg>Moon</button>
  <button class="tog" data-k="mw" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 17c5-1 7-5 9-8s5-4 9-4"/><path d="M3 21c6 0 9-4 11-7s4-4 7-4"/><circle cx="17" cy="16" r="0.8"/><circle cx="7" cy="8" r="0.8"/></svg>Milky Way</button>
  <button class="tog" data-k="camera" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Camera</button>
  <button class="tog" id="more" data-k="menu" aria-pressed="false" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Menu</button>
</nav>

<script type="module" src="js/main.js?v=1115.1805-901b992"></script>
</body>
</html>
